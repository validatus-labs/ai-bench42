name: Release security gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-secret-scan:
    name: Gitleaks / all Git history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history, without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the clone includes Git history
        shell: bash
        run: |
          set -euo pipefail
          test -d .git
          count="$(git rev-list --all --count)"
          echo "Reachable commits: $count"
          test "$count" -gt 0

      - name: Gitleaks full Git history
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --exit-code 1 .

      - name: Gitleaks current worktree
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --redact --no-banner --exit-code 1 .
